<style>
.map-tools{background:#f7fbff;border:1px solid #d6e7f7;border-radius:10px;padding:15px;margin:12px 0}.map-tools summary{cursor:pointer;font-size:16px;font-weight:600}.map-tools[open] summary{margin-bottom:14px}.map-tools h3{margin:0 0 6px;font-size:17px}.map-tools p{font-size:13px;line-height:1.6}.map-tools-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.map-tools label{font-size:14px;min-width:0}.map-tools input{font-size:15px}.map-tools-buttons{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.map-tools button{font-size:13px;padding:8px 10px}.map-tools button[aria-pressed=true]{background:#087cfa;color:white;border-color:#087cfa}.map-tools-results{display:grid;grid-template-columns:1fr 1fr;gap:9px}.map-tools-results article{padding:12px;background:white;border:1px solid #dce8f4;border-radius:8px}.map-tools-results span{font-size:13px;display:block;color:#536b83}.map-tools-results strong{font-size:24px;display:block;margin-top:6px;color:#075fae}.map-tools-status{color:#345e7e;font-size:13px}.map-tools a{color:#075fae;font-size:13px}.logiscope-city-label{white-space:nowrap;font:600 13px 'Segoe UI',Arial,sans-serif;color:#24425c;text-shadow:-1px -1px 0 white,1px -1px 0 white,-1px 1px 0 white,1px 1px 0 white,0 0 4px white;pointer-events:auto;cursor:pointer}.logiscope-city-label:before{content:'•';margin-right:3px;color:#315e80}.access-diagnostic{border:1px solid #e3b46a;background:#fff8eb;border-radius:9px;padding:14px;margin:12px 0;font-size:14px}.access-diagnostic button{margin-right:8px}.access-diagnostic strong{display:block;margin-bottom:7px}@media(max-width:600px){.map-tools-inputs{grid-template-columns:1fr}.map-tools-results strong{font-size:21px}}
</style>
<script>
(function(){
'use strict';
if(window.logiScopeMapToolsLoaded)return;window.logiScopeMapToolsLoaded=true;
const make=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
const byId=id=>document.getElementById(id);
const state={origin:null,destination:null,mode:'',version:0,map:null,layer:null,labels:null,timer:null,diagnosed:false};
function call(name,arg){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](arg));}
// BEGIN MAP TOOLS MODEL
function mapToolsStraight(a,b){const rad=n=>n*Math.PI/180,h=Math.sin(rad(b[0]-a[0])/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(rad(b[1]-a[1])/2)**2;return 6371*2*Math.asin(Math.sqrt(Math.min(1,h)));}
function mapToolsStatus(code){return {ACCOUNT_NOT_ALLOWED:'Sesi Google tidak cocok dengan akun tim yang diizinkan. Buka ulang pada profil Chrome khusus akun Logistik.',SESSION_MISSING:'Identitas Google belum terbaca. Login ulang dengan satu akun tim Logistik.',GOOGLE_AUTH_REQUIRED:'Google belum memberi izin baca yang diperlukan. Buka ulang URL aplikasi dan selesaikan otorisasi Google.',DATA_ACCESS_DENIED:'Akun ini belum dapat membaca salinan operasional. Periksa akun yang sedang login dan izin Viewer spreadsheet.',DATA_NOT_CONFIGURED:'Salinan operasional belum dikonfigurasi oleh administrator.',DATA_SERVICE_UNAVAILABLE:'Layanan pembacaan Google sedang tidak tersedia. Coba muat ulang.',SNAPSHOT_INVALID:'Snapshot operasional belum valid atau belum lengkap. Administrator perlu menjalankan publisher.',DATA_READABLE:'Akses data akun ini berhasil. Klik Muat ulang data untuk mencoba kembali.'}[code]||'Pemeriksaan belum berhasil; coba lagi.';}
// END MAP TOOLS MODEL
function diagnosticPanel(){let box=byId('mapToolsAccess');if(box)return box;box=make('div',undefined,'access-diagnostic');box.id='mapToolsAccess';box.hidden=true;const anchor=byId('error');if(anchor&&anchor.parentNode)anchor.parentNode.insertBefore(box,anchor.nextSibling);return box;}
async function diagnose(){const box=diagnosticPanel();box.hidden=false;box.replaceChildren(make('strong','Pemeriksaan akses data'),make('p','Memeriksa sesi akun dan izin baca…'));try{const result=await call('diagnoseHubAccess');box.replaceChildren(make('strong','Status: '+result.code),make('p',mapToolsStatus(result.code)));if(result.account)box.append(make('p','Akun sesi: '+result.account));}catch(e){box.replaceChildren(make('strong','Pemeriksaan akses belum dapat dijalankan'),make('p','Google mungkin belum mengotorisasi aplikasi pada sesi ini. Gunakan satu akun Logistik dan buka URL aplikasi kembali.'));}const retry=make('button','Muat ulang data'),check=make('button','Periksa lagi');retry.onclick=()=>{if(typeof refresh==='function')refresh();};check.onclick=diagnose;box.append(retry,check);}
function places(){const records=new Map();if(typeof geoLabels!=='undefined')Object.entries(geoLabels).forEach(([key,label])=>{const coords=cityCoordinates(key);if(coords)records.set(cityKey(key),{label,coords});});if(typeof hub!=='undefined'&&hub&&typeof buildLocations==='function')buildLocations(hub).forEach(r=>{const coords=cityCoordinates(r.key);if(coords)records.set(r.key,{label:r.label,coords});});return [...records.values()];}
function setMode(mode){state.mode=mode;['origin','destination'].forEach(key=>byId('mapToolsPick-'+key)?.setAttribute('aria-pressed',String(key===mode)));if(state.map)state.map.getContainer().style.cursor=mode?'crosshair':'';byId('mapToolsHint').textContent=mode?'Klik '+(mode==='origin'?'asal':'tujuan')+' pada peta.':'';byId('mapToolsHint').hidden=!mode;}
function choose(key,coords,label){state[key]={coords,label};byId('mapTools-'+key).value=label;setMode(key==='origin'&&!state.destination?'destination':'');drawMeasurement();measure();}
function drawMeasurement(){state.layer.clearLayers();for(const key of ['origin','destination']){const point=state[key];if(point)L.circleMarker(point.coords,{radius:7,color:key==='origin'?'#087cfa':'#eb9e18',weight:3,fillOpacity:.85}).bindTooltip(make('span',(key==='origin'?'Asal: ':'Tujuan: ')+point.label),{direction:'top'}).addTo(state.layer);}if(state.origin&&state.destination)L.polyline([state.origin.coords,state.destination.coords],{color:'#087cfa',weight:2,dashArray:'6 6'}).bindTooltip(make('span','Garis lurus, bukan lintasan jalan')).addTo(state.layer);}
async function measure(){const version=++state.version,straight=byId('mapToolsStraight'),road=byId('mapToolsRoad'),note=byId('mapToolsNote'),source=byId('mapToolsSource');source.replaceChildren();if(!state.origin||!state.destination){straight.textContent='—';road.textContent='—';note.textContent='';return;}const a=state.origin.coords.slice(),b=state.destination.coords.slice(),km=n=>n.toLocaleString('id-ID',{maximumFractionDigits:1})+' km';straight.textContent=km(mapToolsStraight(a,b));road.textContent='Menghitung…';note.textContent='Menghitung jarak jalan…';try{const result=await call('measureMapRoute',{origin:a,destination:b});if(version!==state.version)return;straight.textContent=km(result.straightKm);road.textContent=result.roadKm===null?'Belum tersedia':km(result.roadKm);note.textContent=result.status==='ok'?'Estimasi jalan bukan dasar tarif resmi.':result.status==='busy'?'Tunggu sebentar, lalu klik Ukur Jarak.':'Jarak jalan belum tersedia.';if(result.roadKm!==null){const link=make('a','Sumber: Google Maps · Periksa rute jalan ↗');link.href='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(a.join(','))+'&destination='+encodeURIComponent(b.join(','))+'&travelmode=driving';link.target='_blank';link.rel='noopener noreferrer';source.append(link);}}catch(e){if(version!==state.version)return;road.textContent='Belum tersedia';note.textContent='Jarak jalan gagal dimuat. Coba lagi.';}}
function buildPanel(){let root=byId('mapToolsPanel');if(root)return root;root=make('details',undefined,'map-tools');root.id='mapToolsPanel';root.addEventListener('toggle',()=>{if(!root.open)setMode('');});root.append(make('summary','Ukur Jarak'));const inputs=make('div',undefined,'map-tools-inputs'),list=make('datalist');list.id='mapToolsCities';places().forEach(p=>{const option=make('option');option.value=p.label;list.append(option);});for(const key of ['origin','destination']){const label=make('label',key==='origin'?'Asal':'Tujuan'),input=make('input');input.id='mapTools-'+key;input.setAttribute('list',list.id);input.placeholder='Ketik nama kota / kabupaten';input.autocomplete='off';input.oninput=()=>{state[key]=null;drawMeasurement();measure();};input.onchange=()=>{const point=places().find(p=>cityKey(p.label)===cityKey(input.value));if(point){choose(key,point.coords,point.label);if(state.origin&&state.destination)state.map.fitBounds([state.origin.coords,state.destination.coords],{padding:[55,55],maxZoom:8,animate:false});else state.map.setView(point.coords,7,{animate:false});}else{state[key]=null;drawMeasurement();measure();byId('mapToolsHint').textContent='Lokasi belum ditemukan. Pilih titik di peta.';byId('mapToolsHint').hidden=false;}};label.append(input);inputs.append(label);}root.append(inputs,list);const buttons=make('div',undefined,'map-tools-buttons');for(const key of ['origin','destination']){const button=make('button',key==='origin'?'Pilih asal di peta':'Pilih tujuan di peta');button.type='button';button.id='mapToolsPick-'+key;button.setAttribute('aria-pressed','false');button.onclick=()=>setMode(state.mode===key?'':key);buttons.append(button);}const measureButton=make('button','Ukur Jarak'),reset=make('button','Reset');measureButton.onclick=measure;reset.onclick=()=>{state.origin=null;state.destination=null;state.version++;byId('mapTools-origin').value='';byId('mapTools-destination').value='';setMode('');drawMeasurement();measure();};buttons.append(measureButton,reset);root.append(buttons);const hint=make('p','','map-tools-status');hint.id='mapToolsHint';hint.hidden=true;root.append(hint);const results=make('div',undefined,'map-tools-results');results.setAttribute('aria-live','polite');for(const [id,label]of [['mapToolsStraight','Garis lurus'],['mapToolsRoad','Jalan / driving']]){const card=make('article'),value=make('strong','—');value.id=id;card.append(make('span',label),value);results.append(card);}const note=make('p',''),source=make('div');note.id='mapToolsNote';source.id='mapToolsSource';root.append(results,note,source);const mapNode=byId('map');mapNode.parentNode.insertBefore(root,mapNode.nextSibling);return root;}
function renderLabels(){if(!state.labels)return;state.labels.clearLayers();const zoom=state.map.getZoom(),bounds=state.map.getBounds(),occupied=[];const priority=['jakarta','kota surabaya','kota bandung','kota medan','kota semarang','kota palembang','kota kediri','makassar','denpasar','jayapura','pontianak','kupang'];const list=places().sort((a,b)=>{const rank=p=>{const i=priority.indexOf(cityKey(p.label));return i<0?999:i;};return rank(a)-rank(b);});for(const point of list){if(!bounds.contains(point.coords))continue;if(zoom<6&&!priority.includes(cityKey(point.label)))continue;const pixel=state.map.latLngToContainerPoint(point.coords),width=Math.min(180,point.label.length*7+8),rect=[pixel.x,pixel.y-9,pixel.x+width,pixel.y+10];if(occupied.some(r=>rect[0]<r[2]+3&&rect[2]>r[0]-3&&rect[1]<r[3]+3&&rect[3]>r[1]-3))continue;occupied.push(rect);const label=make('span',point.label,'logiscope-city-label');const marker=L.marker(point.coords,{icon:L.divIcon({className:'logiscope-city-marker',html:label.outerHTML,iconSize:[0,0],iconAnchor:[-5,8]}),title:point.label,zIndexOffset:600});marker.on('click',()=>{if(state.mode)choose(state.mode,point.coords,point.label);else if(typeof showCityInsight==='function')showCityInsight(point.label);});marker.addTo(state.labels);}}
function attach(){if(typeof hub==='undefined'||!hub||typeof map==='undefined'||!map||!window.L)return false;if(state.map===map)return true;state.map=map;buildPanel();state.layer=L.layerGroup().addTo(map);state.labels=L.layerGroup().addTo(map);[map.dragging,map.scrollWheelZoom,map.touchZoom,map.doubleClickZoom,map.keyboard].forEach(control=>control&&control.enable());map.on('zoomend moveend',renderLabels);let pointerStart=null;map.getContainer().addEventListener('pointerdown',event=>{pointerStart=[event.clientX,event.clientY];},true);map.getContainer().addEventListener('click',event=>{if(!state.mode||event.target.closest('.leaflet-control'))return;if(pointerStart&&Math.hypot(event.clientX-pointerStart[0],event.clientY-pointerStart[1])>5)return;event.preventDefault();event.stopImmediatePropagation();const named=event.target.closest('.logiscope-city-label');const reference=named&&places().find(p=>p.label===named.textContent);if(reference){choose(state.mode,reference.coords,reference.label);return;}const point=map.mouseEventToLatLng(event),coords=[Number(point.lat.toFixed(5)),Number(point.lng.toFixed(5))];if(coords[0]<-12||coords[0]>7||coords[1]<94||coords[1]>142){byId('mapToolsHint').textContent='Pilih titik di dalam wilayah referensi Indonesia.';return;}choose(state.mode,coords,state.mode==='origin'?'Titik asal':'Titik tujuan');},true);renderLabels();return true;}
const baseRender=typeof renderMap==='function'?renderMap:null;if(baseRender)renderMap=function(){const result=baseRender.apply(this,arguments);attach();renderLabels();return result;};
const baseRpc=typeof rpc==='function'?rpc:null;if(baseRpc)rpc=function(name,arg){return baseRpc(name,arg).catch(error=>{if(name==='getHubData')diagnose();throw error;});};
diagnosticPanel();let attempts=0;state.timer=setInterval(()=>{attempts++;const ready=attach();if(!ready&&byId('error')&&!byId('error').hidden&&!state.diagnosed){state.diagnosed=true;diagnose();}if(ready||attempts>=30){clearInterval(state.timer);if(!ready&&!state.diagnosed)diagnose();}},1000);
})();
</script>
