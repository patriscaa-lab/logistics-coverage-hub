.profile strong{font-size:15px}.profile small{font-size:13px}.global-search input,nav button,.subnav button{font-size:16px}.coverage-controls input,.coverage-controls select,.coverage-controls button,.coverage-detail,.map-tools input,.map-tools label,.map-tools button{font-size:16px}.coverage-controls label{font-size:14px}.coverage-legend,.snapshot-note,.service-row,.quick-card strong{font-size:14px}.map-tools-results strong{font-size:24px}.map-tools summary{font-size:18px}

<script>
(function(){
'use strict';
if(window.logiscopeCoverageUX)return;window.logiscopeCoverageUX=true;
const get=id=>document.getElementById(id),make=(tag,text,cls)=>{const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node;};
const ux={snapshot:null,snapshotLayer:null,markers:null,regions:null,selection:null,view:'dashboard',refreshing:false};
// BEGIN UX COVERAGE MODEL
// Flag indikator berasal dari sanitasi server live; bukan pemberian izin di browser.
function uxCanViewPriceIndicators(data){if(data.canViewRates===false)return false;return data.canViewRates===true||(data.routes||[]).some(r=>Object.hasOwn(r,'hasPrice')&&typeof r.hasPrice==='boolean');}
// Proyeksi tampilan: bukti tujuan masuk dipisahkan dari klaim cakupan master.
function uxCoverageRecords(data,filter={}){
  const vendors=new Map((data.vendors||[]).map(v=>[v.id,v]));
  const records=new Map();
  const ensure=value=>{const key=cityKey(value);if(!records.has(key))records.set(key,{key,label:geoLabels[key]||value,coords:cityCoordinates(key),vendors:new Set(),declared:new Set(),priced:new Set(),modes:new Set()});return records.get(key);};
  Object.keys(geoLabels).forEach(ensure);
  (data.routes||[]).forEach(r=>{const v=vendors.get(r.vendorId);if(!v||v.status!=='Aktif'||v.group!=='Ekspedisi / Transport'||(filter.vendor&&filter.vendor!==v.id)||(filter.mode&&filter.mode!==r.mode))return;const record=ensure(r.destination);record.vendors.add(v.id);if(r.mode)record.modes.add(r.mode);if(uxCanViewPriceIndicators(data)&&r.hasPrice===true)record.priced.add(v.id);});
  if(!filter.mode)(data.vendors||[]).filter(v=>v.group==='Ekspedisi / Transport'&&(!filter.vendor||filter.vendor===v.id)).forEach(v=>String(v.coverage||'').split(/[,;|\n]+/).map(s=>s.trim()).filter(Boolean).forEach(value=>ensure(value).declared.add(v.id)));
  return [...records.values()].filter(r=>!filter.coverage||filter.coverage==='all'||(filter.coverage==='multi'&&r.vendors.size>1)||(filter.coverage==='single'&&r.vendors.size===1)||(filter.coverage==='unknown'&&r.vendors.size===0));
}
function uxColor(count){return count>1?'#1481cc':count===1?'#d69727':'#9ba9b7';}
function uxCluster(points,project,zoom){
  if(zoom>=7)return points.map(point=>[point]);
  const buckets=new Map(),size=zoom<5?64:45;
  points.forEach(point=>{const p=project(point.coords),key=Math.floor(p.x/size)+':'+Math.floor(p.y/size);if(!buckets.has(key))buckets.set(key,[]);buckets.get(key).push(point);});return [...buckets.values()];
}
// END UX COVERAGE MODEL
function currentFilter(){return {coverage:get('coverageFilter').value,mode:get('coverageMode').value,vendor:get('coverageVendor').value};}
function records(){return uxCoverageRecords(hub,currentFilter());}
function regionName(record){return typeof uxCityRegions!=='undefined'?uxCityRegions[record.key]||'':'';}
function isCoverage(){return ux.view==='coverage';}
function closeDetail(){ux.selection=null;get('coverageDetail').hidden=true;drawRegions();drawMarkers();}
function showDetail(title,points){
  const panel=get('coverageDetail');panel.replaceChildren();panel.hidden=false;
  const close=make('button','×','close-region');close.type='button';close.setAttribute('aria-label','Tutup detail wilayah');close.onclick=closeDetail;
  const ids=new Set(points.flatMap(r=>[...r.vendors])),declared=new Set(points.flatMap(r=>[...r.declared])),priced=new Set(points.flatMap(r=>[...r.priced]));
  panel.append(close,make('h2',title),make('p',ids.size?ids.size+' vendor aktif terkonfirmasi':'Belum ada coverage terkonfirmasi'));
  if(points.length>1)panel.append(make('p',points.filter(r=>r.vendors.size).length+' tujuan terdata'));
  if(ids.size===1)panel.append(make('p','Single vendor risk','coverage-risk'));
  if(uxCanViewPriceIndicators(hub)&&priced.size)panel.append(make('p',priced.size+' vendor memiliki harga'));
  const names=make('ul');[...ids].slice(0,5).forEach(id=>{const v=hub.vendors.find(v=>v.id===id);if(v)names.append(make('li',v.name));});if(ids.size>5)names.append(make('li','+'+(ids.size-5)+' vendor lainnya'));if(ids.size)panel.append(names);
  if(declared.size)panel.append(make('p',declared.size+' vendor mencatat cakupan di master'));
  const modes=[...new Set(points.flatMap(r=>[...r.modes]))];if(modes.length)panel.append(make('p',modes.join(' · ')));
  if(points.length===1){const compare=make('button','Bandingkan Vendor');compare.onclick=()=>{showView('routes');get('destination').value=resolveRouteLabel(hub,'destination',points[0].label);selectRoutePair(get('origin').value,get('destination').value);get('origin').focus();};panel.append(compare);}
  const directory=make('button','Lihat Vendor');directory.style.marginLeft='6px';directory.onclick=()=>{showView('vendors');get('group').value='Ekspedisi / Transport';get('status').value='';get('vendorSearch').value='';renderVendors();const all=new Set([...ids,...declared]);for(const row of get('vendorRows').children){const name=row.children[0]?.textContent;row.hidden=!!name&&!hub.vendors.some(v=>all.has(v.id)&&v.name===name);}get('vendorCount').textContent=all.size+' vendor · '+title;};directory.disabled=ids.size+declared.size===0;panel.append(directory);
}
function chooseCity(value){const point=records().find(r=>cityKey(r.label)===cityKey(value)||r.key===cityKey(value));if(!point){get('coverageMapStatus').textContent='Lokasi tidak ditemukan pada referensi.';return;}ux.selection={type:'city',key:point.key};get('coverageMapStatus').textContent=point.coords?'':'Koordinat belum tersedia.';showDetail(point.label,[point]);if(point.coords)map.setView(point.coords,8,{animate:false});drawRegions();drawMarkers();}
function chooseRegion(name){const points=records().filter(r=>regionName(r)===name);ux.selection={type:'region',key:name};showDetail(name,points);const feature=uxProvinceBoundaries.features.find(f=>f.properties.name===name);if(feature)map.fitBounds(L.geoJSON(feature).getBounds(),{padding:[30,30],maxZoom:7,animate:false});drawRegions();drawMarkers();}
function drawRegions(){if(!ux.regions||!hub)return;const all=records();ux.regions.eachLayer(layer=>{const name=layer.feature.properties.name,points=all.filter(r=>regionName(r)===name),ids=new Set(points.flatMap(r=>[...r.vendors])),picked=ux.selection?.type==='region'&&ux.selection.key===name;layer.setStyle({fillColor:uxColor(ids.size),fillOpacity:picked?.6:.26,color:picked?'#154f8a':'#fff',weight:picked?2:1});layer.unbindTooltip();layer.bindTooltip(make('span',name+' · '+ids.size+' vendor terdata'));});}
function drawMarkers(){if(!ux.markers||!hub)return;ux.markers.clearLayers();const points=records().filter(r=>r.coords&&map.getBounds().contains(r.coords)&&(map.getZoom()>=6||currentFilter().coverage!=='all'||r.vendors.size||r.declared.size||ux.selection?.key===r.key));const clusters=uxCluster(points,coords=>map.latLngToContainerPoint(coords),map.getZoom());for(const group of clusters){if(group.length>1){const center=group.reduce((a,r)=>[a[0]+r.coords[0]/group.length,a[1]+r.coords[1]/group.length],[0,0]);const icon=L.divIcon({className:'ux-location-cluster',html:'<span>'+group.length+'</span>',iconSize:[32,32]});L.marker(center,{icon,title:group.length+' lokasi'}).bindTooltip(make('span',group.length+' lokasi · klik untuk perbesar')).on('click',()=>map.fitBounds(group.map(r=>r.coords),{padding:[55,55],maxZoom:map.getZoom()+2})).addTo(ux.markers);continue;}const r=group[0],picked=ux.selection?.type==='city'&&ux.selection.key===r.key,color=uxColor(r.vendors.size);if(r.priced.size)L.circleMarker(r.coords,{radius:picked?12:9,color:'#078b69',weight:2,fillOpacity:0,interactive:false}).addTo(ux.markers);L.circleMarker(r.coords,{radius:picked?8:5,color:picked?'#083d6c':color,fillColor:color,weight:picked?3:1,fillOpacity:r.vendors.size?.9:.3}).bindTooltip(make('span',r.label+' · '+(r.vendors.size?r.vendors.size+' vendor':'Belum terdata'))).on('click',()=>chooseCity(r.label)).addTo(ux.markers);}}
function fitSnapshot(){if(!ux.snapshot||!get('coverageSnapshot')?.clientWidth)return;ux.snapshot.invalidateSize({pan:false});ux.snapshot.fitBounds(L.geoJSON(indonesiaBoundary).getBounds(),{padding:[12,12],animate:false});}
function drawSnapshot(){if(!hub||!window.L)return;if(!ux.snapshot){ux.snapshot=L.map('coverageSnapshot',{zoomSnap:0,zoomAnimation:false,zoomControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,touchZoom:false,boxZoom:false,keyboard:false});L.geoJSON(indonesiaBoundary,{interactive:false,style:{color:'#b4c9d7',weight:.5,fillColor:'#dbe7ee',fillOpacity:1}}).addTo(ux.snapshot);ux.snapshot.attributionControl.addAttribution('Natural Earth');ux.snapshotLayer=L.layerGroup().addTo(ux.snapshot);}ux.snapshotLayer.clearLayers();const points=uxCoverageRecords(hub),known=points.filter(r=>r.vendors.size),single=known.filter(r=>r.vendors.size===1);if(typeof uxProvinceBoundaries!=='undefined')L.geoJSON(uxProvinceBoundaries,{interactive:false,style:feature=>{const ids=new Set(points.filter(r=>regionName(r)===feature.properties.name).flatMap(r=>[...r.vendors]));return {color:'#fff',weight:.8,fillColor:uxColor(ids.size),fillOpacity:.65};}}).addTo(ux.snapshotLayer);points.filter(r=>r.coords&&r.priced.size).forEach(r=>L.circleMarker(r.coords,{radius:3,color:'#078b69',weight:1,fillOpacity:.7,interactive:false}).addTo(ux.snapshotLayer));fitSnapshot();get('snapshotSummary').textContent=known.length+' tujuan terkonfirmasi · '+single.length+' single vendor';requestAnimationFrame(fitSnapshot);}
function updateCatalog(){const list=get('coverageLocations');list.replaceChildren();records().forEach(r=>{const option=make('option');option.value=r.label;list.append(option);});uxProvinceBoundaries.features.forEach(f=>{const option=make('option');option.value=f.properties.name;list.append(option);});}
function applyFilters(){closeDetail();updateCatalog();drawRegions();drawMarkers();}
function readyMap(){if(!map||!hub||ux.markers)return;layers.clearLayers();if(typeof provinceLayer!=='undefined'&&provinceLayer)map.removeLayer(provinceLayer);ux.regions=L.geoJSON(uxProvinceBoundaries,{style:{fillOpacity:.26,weight:1,color:'#fff'},onEachFeature:(feature,layer)=>layer.on('click',()=>chooseRegion(feature.properties.name))}).addTo(map);ux.markers=L.layerGroup().addTo(map);map.on('moveend zoomend',drawMarkers);drawRegions();drawMarkers();}
function syncView(name){ux.view=name;document.body.dataset.uxView=name;if(name==='coverage'){get('coverageMapSlot').append(get('coverageWorkspace'));renderMap();requestAnimationFrame(()=>{map?.invalidateSize();drawMarkers();});}if(name==='dashboard')requestAnimationFrame(fitSnapshot);}
function setup(){
  document.body.dataset.uxView='dashboard';document.querySelector('.profile')?.setAttribute('aria-label','Tim Logistik — Akses internal');
  // Kompatibilitas DOM live: hanya teks yang secara eksplisit diaudit dibuang.
  const redundant=new Set(['Hasil berasal dari pasangan origin → destination; arah balik dicari secara terpisah.','Cari rute, pilih vendor, lalu bandingkan layanan dan harga berizin.','Capability, cakupan, dan kesiapan komersial ditampilkan secara terpisah.','Pantau coverage, bandingkan vendor, hitung kebutuhan armada, dan pastikan data logistik selalu lengkap.','Tujuan berharga, pilihan vendor, dan risiko ketergantungan berdasarkan bukti rute aktif.']);
  document.querySelectorAll('p').forEach(p=>{if(redundant.has(p.textContent.trim())||p.textContent.startsWith('Rekomendasi default: vendor Aktif dari kelompok Ekspedisi / Transport'))p.remove();});document.querySelector('.brand small')?.remove();
  const full=get('coverageWorkspace'),panel=full.querySelector('.map-panel'),mapNode=get('map'),canvas=make('div',undefined,'coverage-canvas');canvas.id='coverageCanvas';mapNode.before(canvas);canvas.append(mapNode);const detail=make('section',undefined,'coverage-detail');detail.id='coverageDetail';detail.hidden=true;detail.setAttribute('aria-live','polite');canvas.append(detail);
  get('coverageMapSlot').append(full);const controls=make('form',undefined,'coverage-controls');controls.id='coverageControls';
  const searchLabel=make('label','Lokasi'),input=make('input');input.id='coverageLocation';input.placeholder='Cari provinsi, kota, kabupaten';input.setAttribute('list','coverageLocations');input.autocomplete='off';searchLabel.append(input);const list=make('datalist');list.id='coverageLocations';controls.append(searchLabel,list);
  for(const [id,label,choices] of [['coverageFilter','Coverage',[['all','Semua coverage'],['multi','Multi Vendor'],['single','Single Vendor'],['unknown','Belum Terdata']]],['coverageMode','Moda',[['','Semua moda']]],['coverageVendor','Vendor',[['','Semua vendor']]]]){const field=make('label',label),select=make('select');select.id=id;choices.forEach(([value,label])=>{const option=make('option',label);option.value=value;select.append(option);});select.onchange=applyFilters;field.append(select);controls.append(field);}
  const search=make('button','Cari Lokasi'),reset=make('button','Lihat Indonesia');search.type='submit';reset.type='button';reset.onclick=()=>{input.value='';closeDetail();map.fitBounds([[-11.5,94.5],[6.5,141.5]],{padding:[8,8]});};controls.append(search,reset);controls.onsubmit=e=>{e.preventDefault();const name=input.value.trim(),province=uxProvinceBoundaries.features.find(f=>norm(f.properties.name)===norm(name));province?chooseRegion(province.properties.name):chooseCity(name);};panel.prepend(controls);
  const legend=make('div',undefined,'coverage-legend');[['','Multi Vendor'],['single','Single Vendor'],['unknown','Belum Terdata'],['priced','Harga tersedia']].forEach(([cls,label])=>{const text=make('span',label,cls);if(cls==='priced'){text.id='coveragePriceKey';text.hidden=true;}legend.append(text);});const info=make('button','ⓘ');info.type='button';info.setAttribute('aria-label','Arti coverage');info.title='Bukti tujuan terdata; warna provinsi tidak menjamin seluruh wilayah terlayani. Belum terdata bukan berarti tidak dilayani.';legend.append(info);canvas.after(legend);const status=make('p','','coverage-map-status');status.id='coverageMapStatus';legend.after(status);
  const snapshot=make('section',undefined,'coverage-snapshot'),head=make('div',undefined,'panel-heading'),open=make('button','Buka Coverage Map','snapshot-open');open.onclick=()=>showView('coverage');head.append(make('h2','Coverage Snapshot'),open);const preview=make('div');preview.id='coverageSnapshot';preview.setAttribute('role','img');preview.setAttribute('aria-label','Ringkasan coverage Indonesia');const summary=make('p','','snapshot-note');summary.id='snapshotSummary';snapshot.append(head,preview,summary);get('dashboardMapSlot').append(snapshot);const service=full.querySelector('.service-panel');if(service)get('dashboardMapSlot').append(service);
  const baseShow=showView;showView=function(name){baseShow(name);get('coverageMapSlot').append(full);syncView(name);};
  // Leaflet membutuhkan ukuran container yang terlihat untuk fitBounds.
  const baseMap=renderMap;renderMap=function(){if(!isCoverage())return;const result=baseMap.apply(this,arguments);readyMap();layers?.clearLayers();drawRegions();drawMarkers();return result;};
  showCityInsight=function(value){if(isCoverage())chooseCity(value);};
  const baseRender=render;render=function(){const result=baseRender.apply(this,arguments);ux.refreshing=true;const addOptions=(id,values)=>{const select=get(id),value=select.value;select.replaceChildren();values.forEach(([key,label])=>{const option=make('option',label);option.value=key;select.append(option);});select.value=values.some(([key])=>key===value)?value:values[0][0];};addOptions('coverageMode',[['','Semua moda'],...[...new Set(hub.routes.map(r=>r.mode).filter(Boolean))].sort().map(v=>[v,v])]);addOptions('coverageVendor',[['','Semua vendor'],...hub.vendors.filter(v=>v.group==='Ekspedisi / Transport').map(v=>[v.id,v.name])]);get('coveragePriceKey').hidden=!uxCanViewPriceIndicators(hub);closeDetail();updateCatalog();readyMap();drawRegions();drawMarkers();drawSnapshot();return result;};
  get('mapReset').onclick=()=>showView('coverage');
  if(hub){readyMap();render();}else drawSnapshot();
}
setup();
new ResizeObserver(()=>requestAnimationFrame(fitSnapshot)).observe(get('coverageSnapshot'));
})();
</script>
